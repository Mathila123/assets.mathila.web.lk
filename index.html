<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restricted Area | Mathila Dulsanda</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0b0b;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      padding: 32px 24px;
      text-align: center;
      background: #111;
      border: 1px solid #222;
      border-radius: 16px;
    }
    .icon { font-size: 32px; margin-bottom: 12px; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: #888; font-size: 14px; line-height: 1.5; }
    .progress {
      height: 3px;
      margin: 20px 0;
      background: #222;
      border-radius: 2px;
      overflow: hidden;
    }
    .bar {
      height: 100%;
      background: #fff;
      animation: load 5s linear forwards;
    }
    .footer {
      font-size: 12px;
      color: #666;
      border-top: 1px solid #1a1a1a;
      padding-top: 16px;
      margin-top: 16px;
    }
    .footer a { color: #aaa; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
    @keyframes load {
      from { width: 100%; }
      to { width: 0%; }
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="icon">🔒</div>
    <h1>Restricted Area</h1>
    <p>Access denied. Returning in <b id="countdown">5</b>s...</p>

    <div class="progress"><div class="bar"></div></div>

    <div class="footer">
      Property of <strong>Mathila Dulsanda</strong><br>
      <a href="mailto:hi@mathila.web.lk">hi@mathila.web.lk</a>
    </div>
  </main>

  <script>
    let sec = 5;
    const el = document.getElementById("countdown");
    const timer = setInterval(() => {
      sec--;
      if (sec <= 0) {
        clearInterval(timer);
        document.referrer ? history.back() : location.replace("https://mathila.web.lk");
      } else {
        el.textContent = sec;
      }
    }, 1000);
  </script>

</body>
</html>
